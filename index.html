<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome</title>
  <style>
    :root {
      color-scheme: light;
      --bg-1: #f5f7ff;
      --bg-2: #e2edff;
      --card: #ffffff;
      --text: #1f2a44;
      --accent: #4f7cff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at top, var(--bg-2), var(--bg-1));
      color: var(--text);
    }

    main {
      width: min(92vw, 620px);
      padding: 2.25rem 2rem;
      text-align: center;
      border-radius: 16px;
      background: var(--card);
      box-shadow: 0 10px 30px rgba(28, 52, 116, 0.12);
      border: 1px solid rgba(79, 124, 255, 0.15);
    }

    .badge {
      display: inline-block;
      margin-bottom: 1rem;
      padding: 0.35rem 0.7rem;
      border-radius: 999px;
      font-size: 0.85rem;
      color: #fff;
      background: linear-gradient(135deg, #4f7cff, #6ea4ff);
    }

    h1 {
      margin: 0 0 0.6rem;
      font-size: clamp(1.8rem, 3vw, 2.5rem);
    }

    p {
      margin: 0;
      line-height: 1.6;
      color: #42567f;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <main>
    <span class="badge">Azure Test Web Page</span>
    <h1>Welcome!</h1>
    <p>Thanks for visiting. This page is intentionally simple, clean, and ready to use.</p>
  </main>
</body>
</html>
